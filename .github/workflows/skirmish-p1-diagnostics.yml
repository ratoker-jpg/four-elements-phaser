name: SKIRMISH P1 Diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  vitest-json:
    if: github.event.pull_request.head.ref == 'agent/skirmish-p1-destruction-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Vitest JSON reporter
        id: tests
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=vitest-results.json
      - name: Upload exact test result
        uses: actions/upload-artifact@v4
        with:
          name: skirmish-p1-vitest-results
          path: vitest-results.json
          if-no-files-found: error
      - name: Preserve failure status
        if: steps.tests.outcome == 'failure'
        run: exit 1
