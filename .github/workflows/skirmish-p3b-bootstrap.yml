name: SKIRMISH P3B Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p3b-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skirmish-p3b-factory-composer-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skirmish-p3b-factory-composer-ui
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            src
            tools
            docs/project
            AGENTS.md
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
          persist-credentials: true
      - id: guard
        run: |
          if [ -f tools/apply_skirmish_p3b.py ]; then echo "apply=true" >> "$GITHUB_OUTPUT"; else echo "apply=false" >> "$GITHUB_OUTPUT"; fi
      - name: Apply implementation patch
        if: steps.guard.outputs.apply == 'true'
        run: |
          python3 tools/apply_skirmish_p3b.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/state/statusHelpers.ts')
          text = path.read_text(encoding='utf-8')
          marker = "  BuildingType,\n  HarvesterState,"
          replacement = "  BuildingType,\n  ProducibleUnitType,\n  HarvesterState,"
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif replacement not in text:
              raise SystemExit('status helper type import marker not found')
          path.write_text(text, encoding='utf-8')
          PY
      - if: steps.guard.outputs.apply == 'true'
        run: npm ci
      - if: steps.guard.outputs.apply == 'true'
        run: npm run sync:project-status -- --check
      - name: TypeScript
        id: typecheck
        if: steps.guard.outputs.apply == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee p3b-typecheck.log
      - if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: skirmish-p3b-typecheck
          path: p3b-typecheck.log
          if-no-files-found: error
      - if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Focused composer suite
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success'
        run: >-
          npx vitest run
          src/__tests__/factoryComposerUi.test.ts
          src/__tests__/commandRouter.test.ts
          src/__tests__/unitSelection.test.ts
          src/__tests__/controlGroups.test.ts
          src/__tests__/selectionViewModel.test.ts
          src/__tests__/commandPanelViewModel.test.ts
          src/__tests__/visualHudCore01.test.ts
          src/__tests__/statusHelpers.test.ts
          src/__tests__/production.test.ts
      - if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success'
        run: npm audit --audit-level=high
      - name: Commit implementation
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success'
        run: |
          rm tools/apply_skirmish_p3b.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src tools
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(hud): add selectable factory composer"
          git push origin HEAD:agent/skirmish-p3b-factory-composer-ui
