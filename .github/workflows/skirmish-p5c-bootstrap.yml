name: SKIRMISH P5C Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p5c-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect bootstrap
        id: bootstrap
        run: |
          if [ -f tools/apply_skirmish_p5c.py ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply implementation
        if: steps.bootstrap.outputs.apply == 'true'
        run: |
          python3 tools/apply_skirmish_p5c.py
          python3 tools/apply_skirmish_p5c_fix1.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run sync:project-status -- --check

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1

      - name: Focused P5C tests
        id: focused
        continue-on-error: true
        run: >-
          npx vitest run
          src/__tests__/centerInfinity.test.ts
          src/__tests__/symmetricResources.test.ts
          src/__tests__/generatedMap.test.ts
          src/__tests__/generatedMapValidation.test.ts
          src/__tests__/occupancy.test.ts
          src/__tests__/construction.test.ts
          > p5c-tests.log 2>&1

      - uses: actions/upload-artifact@v4
        if: always() && steps.bootstrap.outputs.apply == 'true'
        with:
          name: skirmish-p5c-diagnostics
          path: |
            typecheck.log
            p5c-tests.log

      - name: Enforce TypeScript
        if: steps.typecheck.outcome != 'success'
        run: |
          cat typecheck.log
          exit 1

      - name: Enforce focused tests
        if: steps.focused.outcome != 'success'
        run: |
          cat p5c-tests.log
          exit 1

      - run: npm audit --audit-level=high
      - run: git diff --check

      - name: Commit implementation
        if: steps.bootstrap.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state src/__tests__/centerInfinity.test.ts
          git commit -m "Protect the canonical center Infinity zone"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
