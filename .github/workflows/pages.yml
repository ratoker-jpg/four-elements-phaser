name: Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number for preview deploy (leave empty for main-site deploy)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build main site
        if: steps.pr.outputs.number == ''
        run: npm run build -- --base /four-elements-phaser/

      - name: Build PR preview
        if: steps.pr.outputs.number != ''
        run: npm run build -- --base /four-elements-phaser/pr-preview/pr-${{ steps.pr.outputs.number }}/

      - name: Copy art-sample viewer into dist
        run: |
          mkdir -p dist/task/art-sample
          cp task/art-sample/index.html dist/task/art-sample/index.html
          cp task/art-sample/README.md dist/task/art-sample/README.md
          mkdir -p dist/art/generated
          cp art/generated/manifest.generated.json dist/art/generated/manifest.generated.json
          cp art/generated/audit-report.json dist/art/generated/audit-report.json

      - name: Copy standalone tools into dist
        run: |
          mkdir -p dist/tools/tankviewer-web-exporter
          cp tools/tankviewer-web-exporter/index.html dist/tools/tankviewer-web-exporter/index.html
          cp tools/tankviewer-web-exporter/README.md dist/tools/tankviewer-web-exporter/README.md

      # ─── Diagnostics: ensure artifact is clean ───────────────────────
      - name: Diagnose dist
        run: |
          echo "=== dist size ==="
          du -sh dist
          echo "=== symlinks in dist ==="
          found_symlinks=$(find dist -type l -ls 2>/dev/null || true)
          if [ -n "$found_symlinks" ]; then
            echo "WARNING: symlinks found in dist:"
            echo "$found_symlinks"
          else
            echo "No symlinks found."
          fi
          echo "=== hardlinks in dist ==="
          found_hardlinks=$(find dist -type f -links +1 -ls 2>/dev/null || true)
          if [ -n "$found_hardlinks" ]; then
            echo "WARNING: hardlinks found in dist:"
            echo "$found_hardlinks"
          else
            echo "No hardlinks found."
          fi
          echo "=== done ==="

      - name: Remove symlinks and hardlinks from dist
        run: |
          # Remove any symlinks
          find dist -type l -delete 2>/dev/null || true
          # Replace hardlinked files with unique copies
          find dist -type f -links +1 -print0 2>/dev/null | while IFS= read -r -d '' f; do
            tmp=$(mktemp)
            cp --remove-destination "$f" "$tmp"
            mv "$tmp" "$f"
          done || true

      # ─── Deploy ───────────────────────────────────────────────────────
      # NOTE: keep_files is intentionally false to prevent gh-pages branch
      # bloat. Previous keep_files:true caused the branch to grow to 7.1 GB
      # across many PR previews, exceeding the 1 GB Pages artifact limit.

      - name: Deploy main site
        if: steps.pr.outputs.number == ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: .
          keep_files: false

      - name: Deploy PR preview
        if: steps.pr.outputs.number != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: pr-preview/pr-${{ steps.pr.outputs.number }}
          keep_files: true

      - name: Comment PR preview link
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}', 10);
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/pr-${prNumber}/`;
            const marker = '<!-- four-elements-phaser-pr-preview -->';
            const body = `${marker}\nPR preview: ${previewUrl}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
