name: SKIRMISH P4 Status Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p4-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-status:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skirmish-p4-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skirmish-p4-status
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            docs/project
            tools
            AGENTS.md
            package.json
          persist-credentials: true
      - id: guard
        run: |
          if [ -f tools/apply_skirmish_p4_status.py ]; then echo "apply=true" >> "$GITHUB_OUTPUT"; else echo "apply=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.apply == 'true'
        run: python3 tools/apply_skirmish_p4_status.py
      - if: steps.guard.outputs.apply == 'true'
        run: npm run sync:project-status
      - if: steps.guard.outputs.apply == 'true'
        run: npm run sync:project-status -- --check
      - name: Commit generated status
        if: steps.guard.outputs.apply == 'true'
        run: |
          rm tools/apply_skirmish_p4_status.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A AGENTS.md docs/project tools
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(status): activate SKIRMISH-P4 multi-team state"
          git push origin HEAD:agent/skirmish-p4-status
