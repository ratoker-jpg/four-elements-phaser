name: SKIRMISH P8C Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p8c-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply implementation and result identity fix
        run: |
          python3 tools/apply_skirmish_p8c.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/phaser/GameScene.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import { evaluateMatchResult, isMatchFinished, resolveRestartSetup } from '../state/matchResult';",
              "import { evaluateMatchResult, resolveRestartSetup } from '../state/matchResult';",
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/state/matchResult.ts')
          text = path.read_text(encoding='utf-8')
          old = """  state.matchResult = {
              outcome,
              winnerTeamId: outcome === 'victory' ? winnerTeamId : null,
              defeatedTeamIds,
              resolvedAtMs,
            };
            return state.matchResult;"""
          new = """  const normalized: MatchResultState = {
              outcome,
              winnerTeamId: outcome === 'victory' ? winnerTeamId : null,
              defeatedTeamIds,
              resolvedAtMs,
            };
            if (raw) {
              Object.assign(raw, normalized);
              state.matchResult = raw;
            } else {
              state.matchResult = normalized;
            }
            return state.matchResult;"""
          if old not in text:
              raise RuntimeError('match result normalization marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run sync:project-status -- --check
      - run: npm run typecheck
      - run: >-
          npx vitest run
          src/__tests__/matchResult.test.ts
          src/__tests__/headquartersCombatTargeting.test.ts
          src/__tests__/headquartersCombat.test.ts
          src/__tests__/saveGame.test.ts
          src/__tests__/fourTeamSaveLoad.test.ts
      - run: npm audit --audit-level=high
      - run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state/types.ts src/state/matchResult.ts src/state/createInitialState.ts src/state/updateGameState.ts src/state/saveGame.ts src/phaser/ui/MatchResultOverlay.ts src/phaser/GameScene.ts src/__tests__/matchResult.test.ts
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Add persistent victory and defeat flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
