name: SKIRMISH P8C Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p8c-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply implementation
        run: python3 tools/apply_skirmish_p8c.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run sync:project-status -- --check

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1

      - name: Focused P8C tests
        id: focused
        continue-on-error: true
        run: >-
          npx vitest run
          src/__tests__/matchResult.test.ts
          src/__tests__/headquartersCombatTargeting.test.ts
          src/__tests__/headquartersCombat.test.ts
          src/__tests__/saveGame.test.ts
          src/__tests__/fourTeamSaveLoad.test.ts
          > p8c-tests.log 2>&1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skirmish-p8c-diagnostics
          path: |
            typecheck.log
            p8c-tests.log
          if-no-files-found: ignore

      - name: Enforce TypeScript
        if: steps.typecheck.outcome != 'success'
        run: |
          cat typecheck.log
          exit 1

      - name: Enforce focused tests
        if: steps.focused.outcome != 'success'
        run: |
          cat p8c-tests.log
          exit 1

      - run: npm audit --audit-level=high
      - run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state/types.ts src/state/matchResult.ts src/state/createInitialState.ts src/state/updateGameState.ts src/state/saveGame.ts src/phaser/ui/MatchResultOverlay.ts src/phaser/GameScene.ts src/__tests__/matchResult.test.ts
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Add persistent victory and defeat flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
