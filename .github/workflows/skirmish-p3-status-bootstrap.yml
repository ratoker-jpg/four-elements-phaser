name: SKIRMISH P3 Status Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p3-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-status:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skirmish-p3-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skirmish-p3-status
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            docs/project
            tools
            AGENTS.md
            package.json
          persist-credentials: true
      - id: guard
        run: |
          if [ -f tools/apply_skirmish_p3_status.py ]; then echo "apply=true" >> "$GITHUB_OUTPUT"; else echo "apply=false" >> "$GITHUB_OUTPUT"; fi
      - name: Apply Phase 3 status
        id: apply
        if: steps.guard.outputs.apply == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 tools/apply_skirmish_p3_status.py 2>&1 | tee p3-status-bootstrap.log
      - name: Upload bootstrap error
        if: steps.guard.outputs.apply == 'true' && steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: skirmish-p3-status-bootstrap-log
          path: p3-status-bootstrap.log
          if-no-files-found: error
      - name: Stop on bootstrap error
        if: steps.guard.outputs.apply == 'true' && steps.apply.outcome == 'failure'
        run: exit 1
      - name: Generate status documents
        if: steps.guard.outputs.apply == 'true' && steps.apply.outcome == 'success'
        run: npm run sync:project-status
      - name: Verify generated status
        if: steps.guard.outputs.apply == 'true' && steps.apply.outcome == 'success'
        run: npm run sync:project-status -- --check
      - name: Commit generated status
        id: publish
        if: steps.guard.outputs.apply == 'true' && steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            rm tools/apply_skirmish_p3_status.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A AGENTS.md docs/project tools
            git diff --cached --check
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "docs(status): activate SKIRMISH-P3 factory composer"
            git push origin HEAD:agent/skirmish-p3-status
          } 2>&1 | tee p3-status-publish.log
      - name: Upload publish error
        if: steps.guard.outputs.apply == 'true' && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: skirmish-p3-status-publish-log
          path: p3-status-publish.log
          if-no-files-found: error
      - name: Stop on publish error
        if: steps.guard.outputs.apply == 'true' && steps.publish.outcome == 'failure'
        run: exit 1
