name: SKIRMISH P3B Registry Contract

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skirmish-p3b-factory-composer-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skirmish-p3b-factory-composer-ui
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            src
            tools
            package.json
            package-lock.json
            tsconfig.json
          persist-credentials: true
      - id: guard
        run: |
          if [ -f tools/apply_skirmish_p3b_registry_contract.py ]; then echo "apply=true" >> "$GITHUB_OUTPUT"; else echo "apply=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.guard.outputs.apply == 'true'
        run: python3 tools/apply_skirmish_p3b_registry_contract.py
      - if: steps.guard.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.apply == 'true'
        run: npm ci
      - if: steps.guard.outputs.apply == 'true'
        run: npm run typecheck
      - if: steps.guard.outputs.apply == 'true'
        run: npx vitest run src/__tests__/commandRegistry.test.ts src/__tests__/factoryComposerUi.test.ts
      - name: Commit registry contract
        if: steps.guard.outputs.apply == 'true'
        run: |
          rm tools/apply_skirmish_p3b_registry_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src tools
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(hud): cover factory composer registry commands"
          git push origin HEAD:agent/skirmish-p3b-factory-composer-ui
