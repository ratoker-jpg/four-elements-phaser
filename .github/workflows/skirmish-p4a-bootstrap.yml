name: SKIRMISH P4A Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p4a-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect bootstrap
        id: bootstrap
        run: |
          if [ -f tools/apply_skirmish_p4a.py ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply implementation
        if: steps.bootstrap.outputs.apply == 'true'
        run: python3 tools/apply_skirmish_p4a.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run sync:project-status -- --check
      - run: npm run typecheck
      - name: Focused P4A tests
        run: >-
          npx vitest run
          src/__tests__/matchState.test.ts
          src/__tests__/production.test.ts
          src/__tests__/construction.test.ts
          src/__tests__/saveGame.test.ts
          src/__tests__/updateGameState.test.ts
      - run: npm audit --audit-level=high
      - run: git diff --check

      - name: Commit implementation
        if: steps.bootstrap.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state src/__tests__/matchState.test.ts
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Implement canonical multi-team match state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
