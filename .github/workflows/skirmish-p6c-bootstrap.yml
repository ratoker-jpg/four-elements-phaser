name: SKIRMISH P6C Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p6c-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply implementation
        run: python3 tools/apply_skirmish_p6c.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run sync:project-status -- --check
      - run: npm run typecheck
      - name: Focused P6C tests
        run: >-
          npx vitest run
          src/__tests__/civilUnitLifecycle.test.ts
          src/__tests__/production.test.ts
          src/__tests__/builder.test.ts
          src/__tests__/occupancy.test.ts
          src/__tests__/fourTeamCivilBootstrap.test.ts
      - run: npm audit --audit-level=high
      - run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state/types.ts src/state/civilUnitLifecycle.ts src/state/createInitialState.ts src/state/updateGameState.ts src/state/builder.ts src/state/occupancy.ts src/state/production.ts src/__tests__/civilUnitLifecycle.test.ts
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Add deterministic civil destruction and replacement"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
