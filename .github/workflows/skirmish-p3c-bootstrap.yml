name: SKIRMISH P3C Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p3c-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skirmish-p3c-factory-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skirmish-p3c-factory-preview
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            src
            tools
            docs/project
            AGENTS.md
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
          persist-credentials: true
      - id: guard
        run: |
          if [ -f tools/apply_skirmish_p3c.py ]; then echo "apply=true" >> "$GITHUB_OUTPUT"; else echo "apply=false" >> "$GITHUB_OUTPUT"; fi
      - name: Apply implementation patch
        if: steps.guard.outputs.apply == 'true'
        run: python3 tools/apply_skirmish_p3c.py
      - if: steps.guard.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.apply == 'true'
        run: npm ci
      - if: steps.guard.outputs.apply == 'true'
        run: npm run sync:project-status -- --check
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee p3c-typecheck.log
      - if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: skirmish-p3c-typecheck
          path: p3c-typecheck.log
          if-no-files-found: error
      - if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Focused preview suite
        id: focused
        continue-on-error: true
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          npx vitest run \
            src/__tests__/factoryComposerPreview.test.ts \
            src/__tests__/factoryComposerPreviewDom.test.ts \
            src/__tests__/factoryComposerUi.test.ts \
            src/__tests__/selectionViewModel.test.ts \
            src/__tests__/visualHudCore01.test.ts 2>&1 | tee p3c-focused.log
      - if: steps.guard.outputs.apply == 'true' && steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: skirmish-p3c-focused
          path: p3c-focused.log
          if-no-files-found: error
      - if: steps.guard.outputs.apply == 'true' && steps.focused.outcome == 'failure'
        run: exit 1
      - if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success'
        run: npm audit --audit-level=high
      - name: Commit implementation
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success'
        run: |
          rm tools/apply_skirmish_p3c.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src tools
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(hud): add modular factory preview"
          git push origin HEAD:agent/skirmish-p3c-factory-preview
