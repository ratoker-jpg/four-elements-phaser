name: Final Status Sync Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-status-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync-status:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'docs/final-status-sync-2026-07-10'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout status files
        uses: actions/checkout@v4
        with:
          ref: docs/final-status-sync-2026-07-10
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /AGENTS.md
            /docs/project/
            /tools/sync_project_status.mjs
            /package.json

      - name: Generate active status documents
        run: node tools/sync_project_status.mjs

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/final-status-sync-apply.yml

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: synchronize final active project status"
          git push origin HEAD:docs/final-status-sync-2026-07-10
