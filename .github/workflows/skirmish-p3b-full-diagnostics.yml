name: SKIRMISH P3B Full Diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  vitest-json:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skirmish-p3b-factory-composer-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full Vitest JSON
        id: vitest
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=vitest-results.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skirmish-p3b-vitest-results
          path: vitest-results.json
          if-no-files-found: error
      - if: steps.vitest.outcome == 'failure'
        run: exit 1
