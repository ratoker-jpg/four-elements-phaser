name: SKIRMISH P2A Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p2a-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skirmish-p2a-combat-movement'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/skirmish-p2a-combat-movement
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            src
            tools
            docs/project
            AGENTS.md
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
          persist-credentials: true

      - name: Detect pending bootstrap
        id: guard
        run: |
          if [ -f tools/apply_skirmish_p2a.py ]; then echo "apply=true" >> "$GITHUB_OUTPUT"; else echo "apply=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node
        if: steps.guard.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation patch
        if: steps.guard.outputs.apply == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_skirmish_p2a.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("import { beforeEach, describe, expect, it } from 'vitest';", "import { afterEach, beforeEach, describe, expect, it } from 'vitest';")
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/apply_skirmish_p2a.py

      - name: Install dependencies
        if: steps.guard.outputs.apply == 'true'
        run: npm ci

      - name: Project status consistency
        if: steps.guard.outputs.apply == 'true'
        run: npm run sync:project-status -- --check

      - name: Typecheck
        id: typecheck
        if: steps.guard.outputs.apply == 'true'
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck log
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: skirmish-p2a-typecheck
          path: typecheck.log
          if-no-files-found: error

      - name: Preserve typecheck failure
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Focused combat movement suite
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success'
        run: >-
          npx vitest run
          src/__tests__/combatUnitMovement.test.ts
          src/__tests__/combatUnits.test.ts
          src/__tests__/unitSelection.test.ts
          src/__tests__/unitCommands.test.ts
          src/__tests__/commandRouter.test.ts
          src/__tests__/occupancy.test.ts
          src/__tests__/combatProductionLifecycle.test.ts
          src/__tests__/saveGame.test.ts

      - name: Dependency audit
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success'
        run: npm audit --audit-level=high

      - name: Commit implementation
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success'
        run: |
          rm tools/apply_skirmish_p2a.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tools/apply_skirmish_p2a.py
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(combat): add canonical Normal Game move and stop runtime"
          git push origin agent/skirmish-p2a-combat-movement
