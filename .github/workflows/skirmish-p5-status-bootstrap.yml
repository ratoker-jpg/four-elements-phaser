name: SKIRMISH P5 Status Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p5-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect bootstrap
        id: bootstrap
        run: |
          if [ -f tools/apply_skirmish_p5_status.py ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply Phase 5 status
        if: steps.bootstrap.outputs.apply == 'true'
        run: python3 tools/apply_skirmish_p5_status.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:project-status
      - run: npm run sync:project-status -- --check
      - run: npm run typecheck
      - run: git diff --check
      - name: Commit generated status
        if: steps.bootstrap.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/project/project-status.json docs/project/PROJECT_STATE.md docs/project/CURRENT_NEXT_STEP.md tools/sync_project_status.mjs
          git commit -m "Activate SKIRMISH Phase 5" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
