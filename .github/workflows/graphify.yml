name: Graphify Project Graph

on:
  workflow_dispatch:
    inputs:
      graphify_args:
        description: "Extra args passed to graphify extract after the code-only corpus path"
        required: false
        default: ""
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/graphify.yml"

permissions:
  contents: read

jobs:
  graphify:
    name: Build Graphify knowledge graph
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install Graphify
        run: uv tool install graphifyy

      - name: Prepare code-only Graphify corpus
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.').resolve()
          out = root / '.graphify-code-corpus'
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)

          allowed_suffixes = {
              '.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs',
              '.py', '.go', '.rs', '.java', '.c', '.cpp', '.rb', '.cs',
              '.kt', '.scala', '.php',
          }
          skipped_parts = {
              '.git', 'node_modules', 'dist', 'build', 'coverage',
              'graphify-out', '.graphify-code-corpus',
          }

          copied = 0
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if any(part in skipped_parts for part in rel.parts):
                  continue
              if path.suffix.lower() not in allowed_suffixes:
                  continue
              target = out / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)
              copied += 1

          print(f'Prepared code-only Graphify corpus with {copied} files at {out}')
          if copied == 0:
              raise SystemExit('No code files found for Graphify corpus')
          PY

      - name: Build project graph
        run: |
          graphify extract .graphify-code-corpus --out . ${{ inputs.graphify_args }}

      - name: Export callflow HTML if supported
        continue-on-error: true
        run: graphify export callflow-html

      - name: Upload Graphify artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out-${{ github.sha }}
          path: |
            graphify-out/**
          if-no-files-found: error
          retention-days: 14
