name: Skirmish Status Sync

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/skirmish-p1-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: blob:none
          sparse-checkout: |
            AGENTS.md
            docs/project
            tools
            package.json
            package-lock.json
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:project-status
      - run: npm run sync:project-status -- --check
      - name: Commit generated status docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/project/PROJECT_STATE.md docs/project/CURRENT_NEXT_STEP.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: sync SKIRMISH-P2 active status"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
