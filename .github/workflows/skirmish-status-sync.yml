name: Skirmish Status Sync

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/skirmish-p1-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          filter: blob:none
          sparse-checkout: |
            AGENTS.md
            docs/project
            tools
            package.json
            package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:project-status
      - run: npm run sync:project-status -- --check
      - name: Upload generated status docs
        uses: actions/upload-artifact@v4
        with:
          name: skirmish-status-docs
          path: |
            AGENTS.md
            docs/project/PROJECT_STATE.md
            docs/project/CURRENT_NEXT_STEP.md
          if-no-files-found: error
