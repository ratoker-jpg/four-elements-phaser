name: Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-donor-vfx:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/godot-vfx-donor-integration' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Phaser feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/godot-vfx-donor-integration
          fetch-depth: 0
          path: target
          sparse-checkout: |
            .github
            src
            tools
            public/assets/vfx
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
            index.html

      - name: Checkout Godot donor subset
        uses: actions/checkout@v4
        with:
          repository: ratoker-jpg/godot-tank-arena
          ref: main
          path: donor
          sparse-checkout: |
            assets/vfx/processed
            docs/vfx_asset_audit.md

      - name: Copy approved alpha-processed LeLu textures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/public/assets/vfx/donor
          files=(
            T_flare8_vfx_alpha.png
            T_VFX_spark44_alpha.png
            T_VFX_exp_dissapear_alpha.png
            T_VFX_Glo31_alpha.png
            T_VFX_hit22_alpha.png
            T_FirePanningCyl45_alpha.png
            T_VFX_RoundSmoke71_alpha.png
            T_trail12_alpha.png
            T_CloudNoise_Tiled_alpha.png
            T_BlastUi6_alpha.png
          )
          for file in "${files[@]}"; do
            test -f "donor/assets/vfx/processed/$file"
            install -m 0644 "donor/assets/vfx/processed/$file" "target/public/assets/vfx/donor/$file"
          done

      - name: Apply deterministic integration patch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_vfx_donor_patch.mjs')
          text = path.read_text(encoding='utf-8')
          guard = '''  if (original.indexOf(before, index + before.length) >= 0) {
            throw new Error(`${path}: patch marker is not unique:\\n${before}`);
          }
          '''
          if guard not in text:
              raise SystemExit('expected patch uniqueness guard not found')
          path.write_text(text.replace(guard, ''), encoding='utf-8')
          PY
          node tools/apply_vfx_donor_patch.mjs
          cp tools/final_validation_vfx.yml .github/workflows/validation.yml
          rm tools/apply_vfx_donor_patch.mjs tools/final_validation_vfx.yml

      - name: Install dependencies
        working-directory: target
        run: npm ci

      - name: Project status consistency
        working-directory: target
        run: npm run check:project-status

      - name: Validate VFX alpha
        working-directory: target
        run: npm run validate:vfx-alpha

      - name: Typecheck
        working-directory: target
        run: npm run typecheck

      - name: Unit tests
        working-directory: target
        run: npm test

      - name: Dependency audit
        working-directory: target
        run: npm audit --audit-level=high

      - name: Commit completed branch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(vfx): import pooled Godot donor texture overlay"
          git push origin HEAD:feat/godot-vfx-donor-integration

  typecheck-test-audit:
    needs: apply-donor-vfx
    if: always() && needs.apply-donor-vfx.result == 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Project status consistency
        run: npm run check:project-status

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Asset budget
        env:
          ASSET_BUDGET_TOTAL_MB: 5200
          ASSET_BUDGET_FILE_MB: 256
        run: npm run check:asset-budget

      - name: Whitespace check
        run: git diff --check
