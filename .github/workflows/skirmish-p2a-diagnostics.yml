name: SKIRMISH P2A Diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  typecheck-log:
    if: github.event.pull_request.head.ref == 'agent/skirmish-p2a-combat-movement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee full-typecheck.log
      - uses: actions/upload-artifact@v4
        with:
          name: skirmish-p2a-full-typecheck
          path: full-typecheck.log
          if-no-files-found: error
      - if: steps.typecheck.outcome == 'failure'
        run: exit 1
