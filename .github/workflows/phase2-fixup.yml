name: Phase 2 Combat Fixup

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-combat-fixup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-fixup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'rts-fnd-p2-unit-factory-combat-production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: rts-fnd-p2-unit-factory-combat-production
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /src/
            /tools/
            /art/generated/
            /task/
            /package.json
            /package-lock.json
            /tsconfig.json
            /vite.config.ts
            /vitest.config.ts
            /index.html

      - name: Stop if fixup already applied
        id: guard
        shell: bash
        run: |
          if [ ! -f tools/apply_phase2_combat_fixup.mjs ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply repository patches
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          node tools/apply_phase2_combat_fixup.mjs
          node tools/apply_phase2_compat_fixup.mjs

      - name: Remove one-shot patchers and workflow
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          rm -f tools/apply_phase2_combat_fixup.mjs
          rm -f tools/apply_phase2_compat_fixup.mjs
          rm -f .github/workflows/phase2-fixup.yml

      - name: Install dependencies
        if: steps.guard.outputs.needed == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set +e
          npm run typecheck > phase2-typecheck.log 2>&1
          status=$?
          cat phase2-typecheck.log
          exit $status

      - name: Upload typecheck diagnostics
        if: always() && steps.guard.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase2-typecheck-diagnostics
          path: phase2-typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Unit tests
        if: steps.guard.outputs.needed == 'true'
        run: npm test

      - name: Audit
        if: steps.guard.outputs.needed == 'true'
        run: npm audit --audit-level=high

      - name: Commit fixup
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          rm -f phase2-typecheck.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "RTS-FND-P2 fixup: canonical multi-unit combat runtime"
          git push origin HEAD:rts-fnd-p2-unit-factory-combat-production
