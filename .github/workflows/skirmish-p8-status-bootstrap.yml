name: SKIRMISH P8 Status Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p8-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Phase 8 status
        run: python3 tools/apply_skirmish_p8_status.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run sync:project-status
      - run: npm run sync:project-status -- --check
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: git diff --check

      - name: Commit status activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/project-status.json tools/sync_project_status.mjs AGENTS.md docs/project/PROJECT_STATE.md docs/project/CURRENT_NEXT_STEP.md
          if git diff --cached --quiet; then
            echo "No status changes to commit"
            exit 0
          fi
          git commit -m "Activate Headquarters combat phase"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
