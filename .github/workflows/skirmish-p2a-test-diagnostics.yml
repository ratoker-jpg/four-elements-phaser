name: SKIRMISH P2A Test Diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  vitest-json:
    if: github.event.pull_request.head.ref == 'agent/skirmish-p2a-combat-movement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: tests
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=vitest-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: skirmish-p2a-vitest-results
          path: vitest-results.json
          if-no-files-found: error
      - if: steps.tests.outcome == 'failure'
        run: exit 1
