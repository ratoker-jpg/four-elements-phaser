name: P4A Legacy Fixture Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: p4a-fix3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply fix
        run: python3 tools/apply_p4a_fix3.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Full Vitest
        run: npx vitest run
      - run: npm audit --audit-level=high
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state/construction.ts src/state/matchState.ts
          if git diff --cached --quiet; then
            echo "No fix changes to commit"
            exit 0
          fi
          git commit -m "Harden legacy match-state normalization"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
