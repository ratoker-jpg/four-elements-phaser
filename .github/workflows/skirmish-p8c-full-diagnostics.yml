name: SKIRMISH P8C Architecture Finalize

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p8c-architecture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extract-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract match-result scene controller
        run: |
          mkdir -p src/phaser/match
          cat > src/phaser/match/MatchResultSceneController.ts <<'TS'
          import type Phaser from 'phaser';
          import type { GameState, MatchSetupSnapshot } from '../../state/types';
          import {
            DEFAULT_SETUP,
            resolveResourceStyleForMapStyle,
            type GameSetupConfig,
          } from '../../state/gameSetup';
          import { evaluateMatchResult, resolveRestartSetup } from '../../state/matchResult';
          import { MatchResultOverlay } from '../ui/MatchResultOverlay';

          export function resolveLoadedGameSetup(
            state: GameState,
            mapId?: string,
          ): GameSetupConfig {
            if (state.matchSetup) return { ...state.matchSetup };
            const mapStyle = state.mapData.terrain.some(row =>
              row.some(tile => tile === 'industrial'),
            ) ? 'industrial' : 'sand';
            return {
              ...DEFAULT_SETUP,
              faction: state.playerFaction,
              mapId: mapId ?? 'customMap1',
              mapStyle,
              resourceStyle: resolveResourceStyleForMapStyle(mapStyle),
            };
          }

          export interface MatchResultSceneDeps {
            scene: Phaser.Scene;
            getState: () => GameState;
            getSetup: () => GameSetupConfig;
            setPaused: (paused: boolean) => void;
            disableInput: () => void;
          }

          export class MatchResultSceneController {
            private readonly overlay = new MatchResultOverlay();

            constructor(private readonly deps: MatchResultSceneDeps) {
              const state = deps.getState();
              state.matchSetup = { ...deps.getSetup() } as MatchSetupSnapshot;
              evaluateMatchResult(state);
            }

            showIfFinished(): boolean {
              const state = this.deps.getState();
              const result = evaluateMatchResult(state);
              if (result.outcome === 'ongoing') return false;
              if (this.overlay.isVisible()) return true;

              this.deps.setPaused(true);
              this.deps.disableInput();
              this.overlay.show(result, {
                onRestart: () => {
                  const setup = resolveRestartSetup(
                    state,
                    this.deps.getSetup() as MatchSetupSnapshot,
                  );
                  this.deps.setPaused(false);
                  this.deps.scene.scene.restart({ ...setup });
                },
                onMainMenu: () => {
                  this.deps.setPaused(false);
                  this.deps.scene.scene.start('MainMenuScene');
                },
              });
              return true;
            }

            destroy(): void {
              this.overlay.destroy();
            }
          }
          TS

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/phaser/GameScene.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import type { GameState, BuildingType, ProducibleUnitType, TerrainType, MatchSetupSnapshot } from '../state/types';",
              "import type { GameState, BuildingType, ProducibleUnitType } from '../state/types';",
              1,
          )
          text = text.replace(
              "import { MatchResultOverlay } from './ui/MatchResultOverlay';\nimport { evaluateMatchResult, resolveRestartSetup } from '../state/matchResult';\n",
              "import { MatchResultSceneController, resolveLoadedGameSetup } from './match/MatchResultSceneController';\n",
              1,
          )
          text = text.replace(
              "import { DEFAULT_SETUP, getMapDataFromConfig, getMapDisplayName, resolveResourceStyleForMapStyle } from '../state/gameSetup';",
              "import { DEFAULT_SETUP, getMapDataFromConfig, getMapDisplayName } from '../state/gameSetup';",
              1,
          )
          text, count = re.subn(
              r"/\*\*\n \* Infer mapStyle from terrain data in a loaded save\..*?\nfunction inferMapStyleFromTerrain\(terrain: TerrainType\[\]\[\]\): MapStyle \{\n  return .*?\n\}\n\n",
              "",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('loaded terrain helper not found')
          text = text.replace(
              "  private matchResultOverlay: MatchResultOverlay | null = null;",
              "  private matchResultController: MatchResultSceneController | null = null;",
              1,
          )
          old_init = """      // VISUAL-05A-PR2 fix: Infer mapStyle from loaded terrain so industrial
                // saves render correctly instead of falling back to sand (DEFAULT_SETUP).
                const inferredStyle = inferMapStyleFromTerrain(data.loadedGameState.mapData.terrain);
                this.setupConfig = data.loadedGameState.matchSetup
                  ? { ...data.loadedGameState.matchSetup }
                  : {
                    ...DEFAULT_SETUP,
                    faction: data.loadedGameState.playerFaction,
                    mapId: data.mapId ?? 'customMap1',
                    mapStyle: inferredStyle,
                    resourceStyle: resolveResourceStyleForMapStyle(inferredStyle),
                  };"""
          new_init = """      this.setupConfig = resolveLoadedGameSetup(
                data.loadedGameState,
                data.mapId,
              );"""
          if old_init not in text:
              raise RuntimeError('loaded setup block not found')
          text = text.replace(old_init, new_init, 1)
          old_setup = """    this.gameState.matchSetup = { ...this.setupConfig } as MatchSetupSnapshot;
              evaluateMatchResult(this.gameState);"""
          new_setup = """    this.matchResultController = new MatchResultSceneController({
              scene: this, getState: () => this.gameState, getSetup: () => this.setupConfig,
              setPaused: paused => { this.paused = paused; },
              disableInput: () => { this.inputController?.destroy(); this.inputController = null; },
            });"""
          if old_setup not in text:
              raise RuntimeError('match setup initialization not found')
          text = text.replace(old_setup, new_setup, 1)
          text = text.replace('    this.finishMatchIfNeeded();', '    this.matchResultController.showIfFinished();', 1)
          text = text.replace(
              '      if (this.finishMatchIfNeeded()) return;',
              '      if (this.matchResultController.showIfFinished()) return;',
              1,
          )
          text, count = re.subn(
              r"\n  private finishMatchIfNeeded\(\): boolean \{.*?\n  \}\n\n  /\*\*\n   \* ARENA-VISUAL-COMBAT-FIX-01",
              "\n  /**\n   * ARENA-VISUAL-COMBAT-FIX-01",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('finishMatchIfNeeded method not found')
          text = text.replace(
              "    this.matchResultOverlay?.destroy();\n    this.matchResultOverlay = null;",
              "    this.matchResultController?.destroy();\n    this.matchResultController = null;",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:project-status -- --check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check:asset-budget
      - run: git diff --check

      - name: Commit architecture fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/phaser/GameScene.ts src/phaser/match/MatchResultSceneController.ts
          git commit -m "Extract match result scene controller"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
