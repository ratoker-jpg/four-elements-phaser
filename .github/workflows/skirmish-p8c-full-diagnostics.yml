name: SKIRMISH P8C Full Diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: skirmish-p8c-full-diag-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-test-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full tests
        id: tests
        continue-on-error: true
        run: npm test > full-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skirmish-p8c-full-test-log
          path: full-test.log
      - name: Enforce
        if: steps.tests.outcome != 'success'
        run: |
          tail -200 full-test.log
          exit 1
