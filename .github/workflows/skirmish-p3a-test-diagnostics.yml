name: SKIRMISH P3A Test Diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  vitest-json:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skirmish-p3a-production-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full Vitest JSON
        run: npx vitest run --reporter=json --outputFile=vitest-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: skirmish-p3a-vitest-results
          path: vitest-results.json
          if-no-files-found: error
