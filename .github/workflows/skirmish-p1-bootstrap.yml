name: SKIRMISH P1 Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skirmish-p1-destruction-lifecycle'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            src
            tools
            docs/project
            public/assets/vfx_donor
            AGENTS.md
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
          persist-credentials: true

      - name: Skip completed bootstrap
        id: guard
        shell: bash
        run: |
          if [ -f tools/apply_skirmish_p1.py ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap patch already consumed."
          fi

      - name: Setup Node
        if: steps.guard.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation patch
        if: steps.guard.outputs.apply == 'true'
        run: python3 tools/apply_skirmish_p1.py

      - name: Install dependencies
        if: steps.guard.outputs.apply == 'true'
        run: npm ci

      - name: Project status consistency
        if: steps.guard.outputs.apply == 'true'
        run: npm run sync:project-status -- --check

      - name: VFX alpha integrity
        if: steps.guard.outputs.apply == 'true'
        run: npm run validate:vfx-alpha

      - name: Typecheck
        if: steps.guard.outputs.apply == 'true'
        run: npm run typecheck

      - name: Targeted lifecycle tests
        if: steps.guard.outputs.apply == 'true'
        run: npx vitest run src/__tests__/blockoutDestructionLifecycle.test.ts

      - name: Full unit suite
        if: steps.guard.outputs.apply == 'true'
        run: npm test

      - name: Dependency audit
        if: steps.guard.outputs.apply == 'true'
        run: npm audit --audit-level=high

      - name: Commit implementation
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          rm tools/apply_skirmish_p1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tools/apply_skirmish_p1.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat(arena): add bounded combat destruction lifecycle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
