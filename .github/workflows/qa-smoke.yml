name: QA Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run QA smoke test
        run: npm run qa:smoke

      - name: Upload QA smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-reports
          path: _reports/
          retention-days: 14
