name: Apply Godot VFX Donor

on:
  pull_request_target:
    types: [opened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-godot-vfx-donor
  cancel-in-progress: false

jobs:
  apply-donor-vfx:
    if: github.event.pull_request.head.ref == 'feat/godot-vfx-donor-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Phaser feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/godot-vfx-donor-integration
          fetch-depth: 0
          path: target
          sparse-checkout: |
            .github
            src
            tools
            public/assets/vfx
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
            index.html

      - name: Checkout Godot donor subset
        uses: actions/checkout@v4
        with:
          repository: ratoker-jpg/godot-tank-arena
          ref: main
          path: donor
          sparse-checkout: |
            assets/vfx/processed
            docs/vfx_asset_audit.md

      - name: Copy approved alpha-processed LeLu textures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/public/assets/vfx/donor
          files=(
            T_flare8_vfx_alpha.png
            T_VFX_spark44_alpha.png
            T_VFX_exp_dissapear_alpha.png
            T_VFX_Glo31_alpha.png
            T_VFX_hit22_alpha.png
            T_FirePanningCyl45_alpha.png
            T_VFX_RoundSmoke71_alpha.png
            T_trail12_alpha.png
            T_CloudNoise_Tiled_alpha.png
            T_BlastUi6_alpha.png
          )
          for file in "${files[@]}"; do
            test -f "donor/assets/vfx/processed/$file"
            install -m 0644 "donor/assets/vfx/processed/$file" "target/public/assets/vfx/donor/$file"
          done

      - name: Apply deterministic TypeScript integration patch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_vfx_donor_patch.mjs')
          text = path.read_text(encoding='utf-8')
          guard = '''  if (original.indexOf(before, index + before.length) >= 0) {
            throw new Error(`${path}: patch marker is not unique:\\n${before}`);
          }
          '''
          if guard not in text:
              raise SystemExit('expected patch uniqueness guard not found')
          path.write_text(text.replace(guard, ''), encoding='utf-8')
          PY
          node tools/apply_vfx_donor_patch.mjs
          rm tools/apply_vfx_donor_patch.mjs

      - name: Install dependencies
        working-directory: target
        run: npm ci

      - name: Validate VFX alpha
        working-directory: target
        run: npm run validate:vfx-alpha

      - name: Typecheck
        working-directory: target
        run: npm run typecheck

      - name: Unit tests
        working-directory: target
        run: npm test

      - name: Commit feature branch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No donor integration changes were produced."
            exit 1
          fi
          git commit -m "feat(vfx): import pooled Godot donor texture overlay"
          git push origin HEAD:feat/godot-vfx-donor-integration
