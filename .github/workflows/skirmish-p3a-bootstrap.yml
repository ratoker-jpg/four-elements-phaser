name: SKIRMISH P3A Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: skirmish-p3a-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skirmish-p3a-production-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skirmish-p3a-production-core
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            src
            tools
            docs/project
            AGENTS.md
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
          persist-credentials: true
      - id: guard
        run: |
          if [ -f tools/apply_skirmish_p3a.py ]; then echo "apply=true" >> "$GITHUB_OUTPUT"; else echo "apply=false" >> "$GITHUB_OUTPUT"; fi
      - name: Apply implementation patch
        if: steps.guard.outputs.apply == 'true'
        run: |
          python3 tools/apply_skirmish_p3a.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/__tests__/t1ProductionComponents.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "function request(bodyId: string, weaponId: string): UnitProductionRequest {"
          new = "function request(bodyId: string, weaponId: string): Extract<UnitProductionRequest, { kind: 'combat' }> {"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('combat request helper marker not found')
          path.write_text(text, encoding='utf-8')
          PY
      - if: steps.guard.outputs.apply == 'true'
        run: npm ci
      - if: steps.guard.outputs.apply == 'true'
        run: npm run sync:project-status -- --check
      - name: TypeScript
        id: typecheck
        if: steps.guard.outputs.apply == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee p3a-typecheck.log
      - name: Upload TypeScript failure
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: skirmish-p3a-typecheck
          path: p3a-typecheck.log
          if-no-files-found: error
      - if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Focused production suite
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success'
        run: >-
          npx vitest run
          src/__tests__/t1ProductionComponents.test.ts
          src/__tests__/production.test.ts
          src/__tests__/combatUnits.test.ts
          src/__tests__/statusHelpers.test.ts
          src/__tests__/commandPanelViewModel.test.ts
          src/__tests__/saveGame.test.ts
      - if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success'
        run: npm audit --audit-level=high
      - name: Commit implementation
        if: steps.guard.outputs.apply == 'true' && steps.typecheck.outcome == 'success'
        shell: bash
        run: |
          rm tools/apply_skirmish_p3a.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src tools
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(production): add config-driven T1 component quotes"
          git push origin HEAD:agent/skirmish-p3a-production-core
